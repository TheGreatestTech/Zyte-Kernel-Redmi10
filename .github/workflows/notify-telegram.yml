name: Notify Telegram on Build Complete

on:
  workflow_run:
    workflows: ["Build Zyte Kernel"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check Telegram secrets
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "$BOT_TOKEN" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "$CHANNEL_ID" ]] || missing+=("TELEGRAM_CHANNEL_ID")
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # head_sha is more precise than head_branch (and survives branch deletion).
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: .github/assets
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Ensure Telegram client dependency
        run: |
          python3 -c 'import requests' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-requests

      - name: Download kernel package from the triggering run
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts

          ARTIFACT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("Zyte-Kernel-")) | .name' | head -n1)"

          if [[ -z "$ARTIFACT" ]]; then
            echo "::warning::No build artifact found for run ${RUN_ID}; continuing with links only"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh run download "$RUN_ID" --name "$ARTIFACT" --dir artifacts
          ZIP="$(find artifacts -type f -name '*.zip' -print -quit)"

          # The zip name carries the release version (…-v1.0.1-<stamp>.zip).
          # Prefer it over the VERSION file: the build run bumped the version
          # after it checked the repo out, so the file here is one bump behind.
          VERSION=""
          if [[ -n "$ZIP" ]]; then
            VERSION="$(basename "$ZIP" | sed -n 's/.*-v\([0-9][0-9.]*\)-[0-9]\{8\}-[0-9]\{4\}.*/\1/p')"
          fi
          [[ -n "$VERSION" ]] || VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo unknown)"

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "zip_path=${ZIP:-}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Downloaded $ARTIFACT (version v$VERSION)"

      - name: Post formatted release to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip_path }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          # The releases API is called without auth otherwise -> 60 requests/hour
          # per IP, and the hosted runners share their IPs. With the token the
          # limit is 5000/hour.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import hashlib, html, json, os, urllib.request
          import requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHANNEL_ID"]
          repo = os.environ["REPO"]
          zip_path = os.environ.get("ZIP_PATH") or ""

          api_url = f"https://api.github.com/repos/{repo}/releases?per_page=10"
          headers = {"Accept": "application/vnd.github+json"}
          gh_token = os.environ.get("GH_TOKEN") or ""
          if gh_token:
              headers["Authorization"] = f"Bearer {gh_token}"
          req = urllib.request.Request(api_url, headers=headers)
          releases = []
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  releases = json.loads(resp.read().decode())
          except Exception as exc:
              # Rate limit or a hiccup - post the package anyway.
              print(f"::warning::GitHub releases API lookup failed: {exc}")

          if not releases:
              print("::warning::No GitHub release found - posting without the release details")

          # Pick the release that actually contains this run's artifact instead of
          # blindly taking "latest" (a newer build may have finished in between).
          zip_name = os.path.basename(zip_path) if zip_path else ""
          rel = None
          if zip_name:
              for candidate in releases:
                  names = {a.get("name") for a in candidate.get("assets", [])}
                  if zip_name in names:
                      rel = candidate
                      break
          if rel is None:
              rel = releases[0] if releases else {}

          version = os.environ.get("VERSION", "unknown")
          artifact = os.environ.get("ARTIFACT") or ""
          # The artifact is named Zyte-Kernel-v1.0-<date>, the tag is
          # zyte-kernel-v1.0-<date> - derive it when the API is unavailable.
          fallback_tag = ""
          if artifact.startswith("Zyte-Kernel-"):
              fallback_tag = "zyte-kernel-" + artifact[len("Zyte-Kernel-"):]

          title = html.escape(rel.get("name") or f"Zyte Kernel v{version}")
          tag = html.escape(rel.get("tag_name") or fallback_tag)
          body = rel.get("body") or ""

          # Build stats written by the build workflow (duration, units, ccache).
          stats = {}
          for root, _dirs, files in os.walk("artifacts"):
              if "build-stats.json" in files:
                  try:
                      with open(os.path.join(root, "build-stats.json")) as fh:
                          stats = json.load(fh)
                  except Exception:
                      stats = {}
                  break

          # Component versions: prefer the resolved tags from build-stats.json
          # ("BakaSU v4.2.0-rc3"), fall back to the release body rows.
          components = stats.get("components") or {}
          comp_lines = []
          root_name = components.get("root") or ""
          root_version = components.get("root_version") or ""
          if root_name:
              comp_lines.append(f"• Root: {root_name} {root_version}".rstrip())
          susfs_version = components.get("susfs_version") or ""
          if susfs_version:
              comp_lines.append(f"• SUSFS {susfs_version}")
          nomount_version = components.get("nomount_version") or ""
          if nomount_version:
              comp_lines.append(f"• NoMount {nomount_version}")

          # Pull the key rows out of the release body table.
          keep_prefixes = (
              "| **Kernel**", "| **Release**", "| **Clang**",
              "| **Root**", "| **SUSFS**", "| **NoMount**",
          )
          body_lines = []
          for raw in body.splitlines():
              if not raw.strip().startswith(keep_prefixes):
                  continue
              # Turn a markdown table row into "Kernel: value".
              cells = [c.strip() for c in raw.strip().strip("|").split("|")]
              if len(cells) < 2:
                  continue
              key = cells[0].replace("**", "")
              value = cells[1].replace("**", "")
              body_lines.append(f"• {html.escape(key)}: {html.escape(value)}")

          # The caption already carries the version and the device, so the
          # blockquote only lists the components and the build details.
          quote_lines = []
          if comp_lines:
              # Versions from the stats file, then kernel/release/clang rows.
              quote_lines.extend(comp_lines)
              quote_lines.extend(body_lines[:3])
          else:
              # No component info available - use the release body rows.
              quote_lines.extend(body_lines)
          changelog = "\n".join(quote_lines)[:600]

          stat_parts = []
          secs = int(stats.get("compile_seconds") or 0)
          if secs:
              stat_parts.append(f"⏱ {secs // 60}m{secs % 60:02d}s")
          units = int(stats.get("units") or 0)
          if units:
              stat_parts.append(f"⚙ {units:,} units")
          rate = stats.get("ccache_hit_rate")
          if rate not in (None, ""):
              filled = max(0, min(10, round(float(rate) / 10)))
              bar = "█" * filled + "░" * (10 - filled)
              stat_parts.append(f"ccache <code>{bar}</code> {float(rate):.0f}%")
          build_line = " · ".join(stat_parts)

          # SHA-256 of the package we are about to upload.
          sha256 = ""
          if zip_path and os.path.exists(zip_path):
              h = hashlib.sha256()
              with open(zip_path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              sha256 = h.hexdigest()

          caption = (
              f"<b>{title}</b>\n"
              f"<i>Version: v{html.escape(version)}</i>\n"
              f"<i>{tag}</i>\n"
              f"<i>Redmi 10 / 2022 / Prime (selene) · MT6768</i>\n"
              + (f"<i>{build_line}</i>\n" if build_line else "")
              + f"\n<blockquote>{changelog}</blockquote>"
          )
          if sha256:
              caption += f"\n\n<code>SHA256\n{sha256}</code>"

          # ------------------------------------------------------------------
          # 1. the banner photo with the announcement
          # 2. the flashable zip as a document right below it
          # 3. a link in the caption that jumps straight to the file
          #
          # Telegram cannot attach a file to a photo message (and albums may
          # not mix photos with documents), so the file is a second message and
          # the caption of the photo gets a link to it.
          # ------------------------------------------------------------------
          banner_path = ".github/assets/zyte_banner.png"
          thumb_path = ".github/assets/zyte_banner_thumb.png"
          zip_name = os.path.basename(zip_path) if zip_path else ""

          # A link to a message: t.me/<username>/<id> for a public channel,
          # t.me/c/<internal id>/<id> otherwise.
          chat_ref = str(chat_id)
          internal_id = chat_ref[4:] if chat_ref.startswith("-100") else chat_ref
          chat_link_base = f"https://t.me/c/{internal_id}"
          try:
              cr = requests.post(
                  f"https://api.telegram.org/bot{token}/getChat",
                  data={"chat_id": chat_id},
                  timeout=30,
              )
              username = (cr.json().get("result") or {}).get("username") or ""
              if username:
                  chat_link_base = f"https://t.me/{username}"
          except Exception:
              pass

          photo_msg_id = None
          doc_msg_id = None

          if os.path.exists(banner_path):
              # 1. the announcement
              with open(banner_path, "rb") as img:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendPhoto",
                      data={"chat_id": chat_id, "caption": caption, "parse_mode": "HTML"},
                      files={"photo": img},
                      timeout=120,
                  )
              r.raise_for_status()
              photo_msg_id = (r.json().get("result") or {}).get("message_id")
          elif zip_path and os.path.exists(zip_path):
              # No banner in the repo - the file carries the announcement.
              doc_caption = caption
              with open(zip_path, "rb") as fh:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendDocument",
                      data={"chat_id": chat_id, "caption": doc_caption, "parse_mode": "HTML"},
                      files={"document": (zip_name, fh)},
                      timeout=300,
                  )
              r.raise_for_status()
              doc_msg_id = (r.json().get("result") or {}).get("message_id")
          else:
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": caption,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  },
                  timeout=60,
              )
              r.raise_for_status()

          # 2. the flashable package
          if zip_path and os.path.exists(zip_path) and photo_msg_id:
              doc_caption = f"<b>Zyte Kernel v{html.escape(version)}</b>\n{html.escape(zip_name)}"
              if sha256:
                  doc_caption += f"\n<code>SHA256: {sha256}</code>"
              files = {"document": (zip_name, open(zip_path, "rb"))}
              if os.path.exists(thumb_path):
                  files["thumbnail"] = ("thumbnail.png", open(thumb_path, "rb"), "image/png")
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendDocument",
                  data={"chat_id": chat_id, "caption": doc_caption, "parse_mode": "HTML"},
                  files=files,
                  timeout=300,
              )
              r.raise_for_status()
              doc_msg_id = (r.json().get("result") or {}).get("message_id")

          # 3. link the announcement to the file
          if photo_msg_id and doc_msg_id and chat_link_base:
              link = f"{chat_link_base}/{doc_msg_id}"
              linked = (
                  caption
                  + f"\n\n<b>Package:</b>\n"
                  + f'<a href="{html.escape(link)}">\U0001F4E6 {html.escape(zip_name)}</a>'
              )
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/editMessageCaption",
                      data={
                          "chat_id": chat_id,
                          "message_id": photo_msg_id,
                          "caption": linked,
                          "parse_mode": "HTML",
                      },
                      timeout=60,
                  )
                  r.raise_for_status()
              except Exception as exc:
                  print(f"::warning::Could not add the package link: {exc}")

          EOF
