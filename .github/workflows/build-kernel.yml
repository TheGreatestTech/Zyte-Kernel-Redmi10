name: Build Zyte Kernel

on:
  workflow_dispatch:
    inputs:
      neutron_tag:
        description: 'Neutron Clang release tag (use latest or a specific tag)'
        required: false
        default: 'latest'
        type: string
      kernel_ref:
        description: 'Kernel branch/tag/commit to build (default: the branch tip)'
        required: false
        default: ''
        type: string
      variant:
        description: 'Kernel variant'
        required: false
        default: 'all-in-one'
        type: choice
        options:
          - all-in-one
          - root-nomount
          - kazesu
          - base
      jobs_count:
        description: 'Parallel build jobs (default 5)'
        required: false
        default: '5'
        type: string
      version_bump:
        description: 'Version bump (auto = +0.1 when a dependency changed, major = whole version)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - patch
          - none
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: github
  KBUILD_BUILD_VERSION: '1'
  # The kernel source is a separate repository; this repo only carries the
  # build script and the patches. The branch tip is used, so a kernel update
  # in the source repo is picked up automatically - no pin to bump here.
  KERNEL_REPO: 'https://github.com/TheGreatestTech/MT6768-Kernel-4.19.git'
  KERNEL_BRANCH: 'lineage-24.0'
  # ccache object cache cap (on-disk, compressed). One full selene build is
  # roughly 0.8-1.5 GB compressed, so 3 GB holds a couple of variants plus
  # headroom. Raising it only makes every run upload more: actions/cache keys
  # are immutable, so each run saves a fresh full snapshot of this directory.
  CCACHE_MAXSIZE: '3G'

jobs:
  build:
    name: Build ${{ inputs.variant || 'all-in-one' }}
    runs-on: ubuntu-latest
    # A clean build takes ~20-30 min; anything past 2h is a hang, not a build.
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify release permissions
        env:
          # Probe the real sequence (tag + release) with each token, then delete
          # the probe. Fails in seconds instead of after a 20 minute build.
          REPO: ${{ github.repository }}
          TAG: zyte-perm-probe-${{ github.run_id }}
          SHA: ${{ github.sha }}
          NAME: permission probe
          TOKENS: ${{ secrets.RELEASE_TOKEN }} ${{ github.token }}
          PROBE: '1'
        run: bash scripts/publish-release.sh

      - name: Set build date
        run: |
          set -Eeuo pipefail
          echo "BUILD_DATE=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # The runner image already ships almost all of this. Installing the
          # whole list unconditionally costs ~40s of pure latency (apt update +
          # dpkg churn) on every single run, so only touch apt when something
          # is genuinely missing.
          packages=(
            bc bison build-essential ccache cpio curl device-tree-compiler
            flex git libelf-dev libncurses-dev libssl-dev lz4 make patch
            perl pkg-config python3 python3-requests rsync unzip zip zstd wget
          )
          missing=()
          for p in "${packages[@]}"; do
            dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
          done

          if (( ${#missing[@]} == 0 )); then
            echo "All build dependencies already present - apt skipped"
            exit 0
          fi

          echo "Installing ${#missing[@]} missing package(s): ${missing[*]}"
          sudo -E apt-get update -qq -o Acquire::Retries=3
          sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${missing[@]}"

      - name: Checkout kernel source
        run: |
          set -Eeuo pipefail
          rm -rf source
          mkdir -p source
          git -C source init -q
          git -C source remote add origin "$KERNEL_REPO"

          # Track the branch tip: a kernel update in the source repo is then
          # picked up by the next run without touching this repo. A specific
          # ref can still be requested per-run with the kernel_ref input.
          git -C source fetch -q --depth 1 origin "$KERNEL_BRANCH"
          if [[ -n "${{ inputs.kernel_ref }}" ]]; then
            REF="${{ inputs.kernel_ref }}"
            resolved=0
            # A branch or tag fetches directly; a commit SHA has to be
            # resolved from the branch history, because GitHub refuses
            # "git fetch <sha>" for refs it does not advertise. Deepen the
            # fetch until the commit shows up.
            for depth in 1 50 200 1000; do
              if git -C source fetch -q --depth "$depth" origin "$KERNEL_BRANCH"; then
                # The ref may name a branch or tag of its own.
                if git -C source fetch -q --depth "$depth" origin "$REF" 2>/dev/null; then
                  git -C source checkout -q --detach FETCH_HEAD
                  echo "Kernel: $REF (requested)"
                  resolved=1
                  break
                fi
                if git -C source rev-parse --verify --quiet "$REF^{commit}" >/dev/null; then
                  git -C source checkout -q --detach "$REF"
                  echo "Kernel: $REF (requested, history depth $depth)"
                  resolved=1
                  break
                fi
              fi
            done
            if [[ "$resolved" -ne 1 ]]; then
              echo "::error::Could not resolve '$REF' from '$KERNEL_REPO'"
              exit 1
            fi
          else
            git -C source checkout -q --detach FETCH_HEAD
            echo "Kernel: branch tip of $KERNEL_BRANCH"
          fi
          test -f source/Makefile
          echo "KERNEL_COMMIT=$(git -C source rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "Kernel: $(git -C source log -1 --format='%h %s')"

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Resolve Neutron Clang tag
        id: neutron
        env:
          REQUESTED_TAG: ${{ inputs.neutron_tag || 'latest' }}
        run: |
          set -Eeuo pipefail
          if [[ "$REQUESTED_TAG" == "latest" ]]; then
            TAG="$(curl -fsSL --retry 5 --retry-all-errors \
              https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main/latest.txt \
              | awk '/^\[tag\]$/{getline; print; exit}')"
          else
            TAG="$REQUESTED_TAG"
            curl -fsSL --retry 5 --retry-all-errors \
              "https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main/${TAG}-info.txt" \
              -o /dev/null
          fi
          [[ -n "$TAG" ]] || { echo 'Could not resolve Neutron Clang tag' >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using Neutron Clang tag: $TAG"

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: toolchains/neutron-clang
          key: neutron-clang-${{ runner.os }}-${{ steps.neutron.outputs.tag }}

      - name: Download Neutron Clang with AntMan
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p toolchains/neutron-clang
          cd toolchains/neutron-clang
          curl -fsSLo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman "-S=${{ steps.neutron.outputs.tag }}"

      - name: Verify Neutron Clang
        run: |
          set -Eeuo pipefail
          test -x toolchains/neutron-clang/bin/clang
          test -x toolchains/neutron-clang/bin/ld.lld
          toolchains/neutron-clang/bin/clang --version | head -n 2

      - name: Cache compiler objects
        uses: hendrikmuhs/ccache-action@v1.2
        # A broken/missing cache must never fail the build - it only costs time.
        continue-on-error: true
        with:
          # ccache-action saves under "<key>-<timestamp>", so the exact key never
          # matches; restore-keys is what actually restores. Without it the cache
          # was uploaded every run and never read back.
          key: zyte-selene-${{ runner.os }}-${{ steps.neutron.outputs.tag }}
          restore-keys: |
            zyte-selene-${{ runner.os }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}
          variant: ccache
          job-summary: ccache

      - name: Checkout selene AnyKernel3 template
        uses: actions/checkout@v4
        with:
          repository: TheGreatestTech/AnyKernel3-selene
          ref: master
          path: Zyte-Kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Verify AnyKernel3 template
        run: |
          set -Eeuo pipefail
          test -f Zyte-Kernel/anykernel.sh
          test -f Zyte-Kernel/tools/ak3-core.sh
          test -f Zyte-Kernel/META-INF/com/google/android/update-binary
          echo "ANYKERNEL_COMMIT=$(git -C Zyte-Kernel rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Apply root/SUSFS/NoMount integration
        run: |
          set -Eeuo pipefail
          bash ./build.sh --ci-integrate-only --variant "${{ inputs.variant || 'all-in-one' }}"

      - name: Resolve version
        env:
          # auto  - bump the minor part by one when a dependency changed
          #         (1.0 -> 1.1 -> ... -> 1.9 -> 1.10 -> 2.0)
          # major - always bump the whole version (v1 -> v2)
          # patch - always do the "auto" step
          # none  - never touch the version
          #
          # The dependencies are known here: the integration step resolved
          # the BakaSU / NoMount / SUSFS versions and the kernel commit.
          BUMP_TYPE: ${{ inputs.version_bump || 'auto' }}
        run: |
          set -Eeuo pipefail
          OLD_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "Current version: v$OLD_VERSION (bump type: $BUMP_TYPE)"
          echo "Dependencies: root=${KAZESU_VERSION:-unknown} nomount=${NOMOUNT_VERSION:-unknown} susfs=${SUSFS_VERSION:-unknown} kernel=${KERNEL_COMMIT:-unknown}"

          bash scripts/bump-version.sh "$BUMP_TYPE"
          NEW_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "New version: v$NEW_VERSION"

          if [[ ( "$BUMP_TYPE" == "major" || "$BUMP_TYPE" == "patch" ) && "$NEW_VERSION" == "$OLD_VERSION" ]]; then
            echo "::error::Version bump did not change VERSION ($OLD_VERSION)"
            exit 1
          fi

          if git diff --quiet -- VERSION dependencies.json; then
            echo "Version unchanged (bump: $BUMP_TYPE)"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION dependencies.json
          git commit -m "chore: version v$NEW_VERSION"

          BRANCH="${{ github.ref_name }}"
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning::Could not push the version bump to $BRANCH (another run may have bumped it)"
          else
            echo "Pushed version v$NEW_VERSION to $BRANCH"
          fi

      - name: Build kernel
        env:
          BUILD_VARIANT: ${{ inputs.variant || 'all-in-one' }}
          OUT_DIR: ${{ github.workspace }}/out
          TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/neutron-clang
          ANYKERNEL_DIR: ${{ github.workspace }}/Zyte-Kernel
          # GitHub's free runners are small (2 vCPU on private repos, 4 on
          # public), so oversubscribe a little instead of starving make.
          JOBS: ${{ inputs.jobs_count || '5' }}
          MAKE_LOAD_LIMIT: "0"
        run: |
          set -Eeuo pipefail
          echo "Runner CPUs: $(nproc) - building with JOBS=$JOBS"
          bash ./build.sh --clean --reconfig --variant "${{ inputs.variant || 'all-in-one' }}"

          ZIP="$(find out -maxdepth 1 -type f -name 'Zyte-Kernel-*.zip' -print -quit)"
          [[ -n "$ZIP" && -s "$ZIP" ]] || {
            echo 'Kernel zip was not produced' >&2
            exit 1
          }
          mkdir -p releases/logs
          cp -f "$ZIP" releases/
          cp -f out/build.log releases/logs/build.log
          echo "KERNEL_RELEASE=$(cat out/include/config/kernel.release)" >> "$GITHUB_ENV"
          echo "Package: $(basename "$ZIP")"

          if [[ -f out/build-stats.json ]]; then
            cp -f out/build-stats.json releases/
            BUILD_STATS="$(python3 -c '
            import json
            d = json.load(open("out/build-stats.json"))
            secs = int(d.get("compile_seconds") or 0)
            units = int(d.get("units") or 0)
            rate = d.get("ccache_hit_rate")
            parts = []
            if secs:
                parts.append("%dm%02ds" % (secs // 60, secs % 60))
            if units:
                parts.append("{:,} units".format(units))
            if rate not in (None, ""):
                parts.append("ccache %s%%" % rate)
            print(" · ".join(parts))
            ')"
            # The build numbers stay in the run summary - the release notes
            # and the Telegram post carry no build internals.
            echo "BUILD_STATS=$BUILD_STATS" >> "$GITHUB_ENV"
            echo "Build stats: $BUILD_STATS"
          fi

      - name: Build summary
        run: |
          set -Eeuo pipefail
          # Every value gets a default: this step runs *after* a 17 minute
          # build, so an unset variable must never abort the job.
          {
            echo "### 🎯 Zyte Kernel v${ZYTE_VERSION:-unknown}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Kernel | \`${KERNEL_COMMIT:-unknown}\` |"
            echo "| Release | \`${KERNEL_RELEASE:-unknown}\` |"
            echo "| Clang | \`${{ steps.neutron.outputs.tag || 'unknown' }}\` |"
            echo "| Variant | \`${{ inputs.variant || 'all-in-one' }}\` |"
            echo "| Jobs | \`${{ inputs.jobs_count || '5' }}\` on $(nproc) CPUs |"
            if [[ -n "${BUILD_STATS:-}" ]]; then
              echo "| Build | $BUILD_STATS |"
            fi
            echo "| Release token | ${RELEASE_TOKEN_SOURCE:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release files and generate checksums
        run: |
          set -Eeuo pipefail
          mapfile -t ZIPS < <(find releases -maxdepth 1 -type f -name '*.zip' | sort)
          [[ "${#ZIPS[@]}" -eq 1 ]] || {
            echo "Expected exactly one ZIP, found ${#ZIPS[@]}" >&2
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          }
          (cd releases && find . -maxdepth 1 -type f -name '*.zip' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat releases/SHA256SUMS

      - name: Prepare release body
        run: |
          set -Eeuo pipefail
          mkdir -p releases
          cat > releases/RELEASE_BODY.md <<'BODY'
          # 🎯 Zyte Kernel **v${{ env.ZYTE_VERSION }}** for Redmi 10 / 2022 / Prime (selene / MT6768)

          Automated kernel build with **BakaSU** + optional **SUSFS v2.4.0** + **NoMount**.

          ---
          ### 📦 Source & Toolchain
          | Component | Version |
          |-----------|---------|
          | **Version** | `v${{ env.ZYTE_VERSION }}` |
          | **Kernel** | `${{ env.KERNEL_COMMIT }}` (LineageOS 24.0, 4.19.325) |
          | **Release** | `${{ env.KERNEL_RELEASE }}` |
          | **Clang** | `${{ steps.neutron.outputs.tag }}` (Neutron Toolchains) |
          | **AnyKernel3** | `${{ env.ANYKERNEL_COMMIT }}` |
          | **Root** | `${{ env.KAZESU_VERSION || 'unknown' }}` (BakaSU @ `${{ env.KAZESU_COMMIT }}`) |
          | **SUSFS** | `${{ env.SUSFS_VERSION || 'n/a' }}` |
          | **NoMount** | `${{ env.NOMOUNT_VERSION || 'n/a' }}` (`${{ env.NOMOUNT_COMMIT }}`) |

          ---
          ### 🏗️ Build Configuration
          - **Variant:** `${{ inputs.variant || 'all-in-one' }}`
          - **Root:** BakaSU `${{ env.KAZESU_VERSION || 'unknown' }}` (`CONFIG_KSU=y`, manual hook mode)
          - **SUSFS:** `${{ env.SUSFS_VERSION || 'v2.4.0' }}` (all-in-one only)
          - **NoMount:** `${{ env.NOMOUNT_VERSION || 'n/a' }}`
          - **Logging:** Disabled (`CONFIG_KSU_SUSFS_ENABLE_LOG` not set)

          ---
          ### 📥 Installation
          1. Download the `Zyte-Kernel-*.zip` from this release
          2. Get the BakaSU manager APK (`arm64-v8a`) from the
             [BakaSU group](https://t.me/BakaSU_Grp/4)
          3. Verify the SHA-256 checksum (see `SHA256SUMS`)
          4. Flash the kernel zip via **TWRP** / **OrangeFox** / any custom recovery
          5. Install the manager APK on the phone
          6. Reboot

          > ⚠️ **Note:** This kernel is for **Redmi 10 / 2022 / Prime (selene)** only.

          ---
          ### 🔗 Links
          - [Kernel source](https://github.com/TheGreatestTech/MT6768-Kernel-4.19)
          - [AnyKernel3 Template](https://github.com/TheGreatestTech/AnyKernel3-selene)
          - [BakaSU](https://github.com/Baka-SU/BakaSU)
          - [SUSFS](https://gitlab.com/simonpunk/susfs4ksu)
          - [NoMount](https://github.com/maxsteeel/nomount)

          Built with ❤️ using GitHub Actions
          BODY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zyte-Kernel-v${{ env.ZYTE_VERSION }}-${{ env.BUILD_DATE }}
          path: |
            releases/*.zip
            releases/SHA256SUMS
            releases/build-stats.json
            releases/logs/*.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          REPO: ${{ github.repository }}
          TAG: zyte-kernel-v${{ env.ZYTE_VERSION }}-${{ env.BUILD_DATE }}
          SHA: ${{ github.sha }}
          NAME: Zyte Kernel v${{ env.ZYTE_VERSION }} - ${{ env.BUILD_DATE }}
          BODY_FILE: releases/RELEASE_BODY.md
          TOKENS: ${{ env.RELEASE_TOKEN_CHOSEN }} ${{ env.RELEASE_TOKEN_OTHERS }}
        run: |
          set -Eeuo pipefail
          # Collect the assets without `ls` parsing, and fail loudly if the
          # package is missing instead of publishing an empty release.
          mapfile -t ASSET_FILES < <(find releases -maxdepth 1 -type f \
            \( -name '*.zip' -o -name 'SHA256SUMS' \) | sort)
          [[ "${#ASSET_FILES[@]}" -ge 1 ]] || {
            echo '::error::No release assets found in releases/'
            exit 1
          }
          export ASSETS="${ASSET_FILES[*]}"
          echo "Assets: $ASSETS"
          bash scripts/publish-release.sh
